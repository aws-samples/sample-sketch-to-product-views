id: analyser-luna-bedrock
name: GPT-5.6 Luna (Bedrock, US)
category: analyser
provider: bedrock
# The US geo profile: Luna has no in-Region inference on bedrock-runtime
# (https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-56-luna.html).
# Regions read with `aws bedrock get-inference-profile` on 2026-11-07.
bedrockModelId: us.openai.gpt-5.6-luna
region: us-east-1
residency: [us-east-1, us-east-2, us-west-2]
lifecycle: active
isDefault: false
description: >-
  The analyser on Bedrock: the same prompt, schema and checks as the other analysers, through Converse with
  structured output. Selected per deployment with `analyser_model` in Terraform.
tags: [openai, bedrock, multimodal, analyser]

requiredInputs: [images]
acceptsInputs: [images, product_metadata]

# Converse takes structured content blocks rather than a flat body, so there is no provider
# field mapping to do here.
apiFieldMap: {}

# No `temperature`: measured on 2026-09-28, Luna on Bedrock rejects the field ("This model
# doesn't support the temperature field"). A max_tokens of 2048 was accepted.
params:
  - key: max_tokens
    type: number
    label: Max tokens
    default: 4096
    advanced: true

notes: >-
  Structured output via Converse `outputConfig.textFormat` (json_schema); the answer is the
  first text block, after the reasoning block. IAM needs the inference-profile ARN, the
  foundation-model ARN in every Region of the profile and, per the model card, the account's
  `project/default` (only the default project is supported).

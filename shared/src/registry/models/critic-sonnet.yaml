id: critic-sonnet
name: Claude Sonnet 4.6 (US)
category: critic
bedrockModelId: us.anthropic.claude-sonnet-4-6
region: us-east-1
# The US geo profile's Regions, read with `aws bedrock get-inference-profile` on 2026-11-07.
residency: [us-east-1, us-east-2, us-west-2]
lifecycle: active
isDefault: true
description: >-
  The critic: scores a generated candidate against the sketch and the completed
  specification. Runs on the US geo profile.
tags: [anthropic, multimodal, critic]

requiredInputs: [sketch, candidate, spec]
acceptsInputs: [sketch, candidate, spec, swatch]

# Converse takes structured content blocks rather than a flat body, so there is no
# provider field mapping to do here.
apiFieldMap: {}

params:
  - key: max_tokens
    type: number
    label: Max tokens
    # The comparison lists up to twelve parts with reasons; it needs at least 3072.
    default: 4096
    min: 256
    max: 4096
    advanced: true
  - key: temperature
    type: number
    label: Temperature
    default: 0
    min: 0
    max: 1
    step: 0.1
    advanced: true
    description: >-
      Zero by default. A critic that scores the same image differently on two runs
      cannot support a retry decision.

costPerCall: 0.01

notes: >-
  Compares the candidate with the sketch and the material sample, aspect by aspect, in one
  call; the verdict is computed in code from the answers.
